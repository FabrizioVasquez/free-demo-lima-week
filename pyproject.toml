[project]
name = "brujula"
version = "0.1.0"
description = "Brújula Tech Week: recomendador semántico local de eventos de Perú Tech Week 2026"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "lancedb>=0.15",
    "fastembed>=0.4",
    "numpy>=1.26",
]

[project.scripts]
btw = "brujula.cli:main"

[project.optional-dependencies]
browser = [
    "crawl4ai>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brujula"]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "pip-audit>=2.10.1",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501", "E701", "E702", "E731"]

[tool.pytest.ini_options]
testpaths = ["tests"]
