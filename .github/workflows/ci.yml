name: CI
on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ["data/**", "**.md"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen --python 3.12
      - run: uv run ruff check src tests
      - run: uv run pytest -q
