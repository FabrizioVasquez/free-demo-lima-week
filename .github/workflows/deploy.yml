name: Deploy to Cloud Run
on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # autenticación sin llaves (Workload Identity Federation)

env:
  REGION: ${{ vars.GCP_REGION || 'us-central1' }}
  SERVICE: brujula-tech-week

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Build and push image
        run: |
          IMAGE="$REGION-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/brujula/app:${{ github.sha }}"
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
      - uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ env.IMAGE }}
          flags: --allow-unauthenticated --memory=2Gi --cpu=1 --min-instances=0 --max-instances=2 --concurrency=20
      - name: Health check
        run: |
          URL=$(gcloud run services describe "$SERVICE" --region "$REGION" --format='value(status.url)')
          curl -fsS "$URL/healthz"
