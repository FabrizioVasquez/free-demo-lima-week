name: Deploy to Cloud Run
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:

# Mínimo privilegio: solo lectura del repo y poder pedir un token OIDC (sin llaves de Google guardadas en GitHub).
permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  REGION: ${{ vars.GCP_REGION }}
  SERVICE: brujula-tech-week

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - name: Build and push image
        run: |
          IMAGE="$REGION-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/brujula/app:${{ github.sha }}"
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
      - uses: google-github-actions/deploy-cloudrun@2028e2d7d30a78c6910e0632e48dd561b064884d # v3.0.1
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ env.IMAGE }}
          # la cuenta de ejecución NO tiene roles; el acceso público (invoker) lo concede una sola vez scripts/gcp-setup.sh
          flags: >-
            --service-account=brujula-runtime@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com
            --memory=1Gi --cpu=1 --min-instances=0 --max-instances=2 --concurrency=20 --timeout=30s
            --execution-environment=gen2
      - name: Health check
        run: |
          URL=$(gcloud run services describe "$SERVICE" --region "$REGION" --format='value(status.url)')
          curl -fsS --retry 5 --retry-delay 5 "$URL/healthz"
