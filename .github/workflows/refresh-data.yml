name: Refresh data
# Vuelve a leer Luma, y si algo cambió (cupos, agotados, eventos nuevos) lo versiona y redespliega.
# Desactívalo después del 18 de octubre de 2026.
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true  # este es el único workflow que hace push
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv sync --frozen --python 3.12
      - run: uv run btw scrape
      - name: Validar datos antes de versionarlos
        run: |
          uv run python - <<'PY'
          import json
          ev = json.load(open("data/events.json"))
          assert 50 <= len(ev) <= 400, f"cantidad sospechosa de eventos: {len(ev)}"
          assert all(e["url"].startswith("https://luma.com/") for e in ev), "URL fuera de luma.com"
          assert all(e["status"] in ("abierto", "agotado", "lista de espera") for e in ev)
          print("ok:", len(ev), "eventos")
          PY
      - name: Commit and redeploy if changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- data/events.json; then echo "Sin cambios"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/events.json
          git commit -m "data: actualiza eventos de Luma"
          git push
          gh workflow run deploy.yml --ref main
